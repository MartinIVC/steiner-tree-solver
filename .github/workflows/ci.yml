name: C++ CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile solver with strict warnings
        run: make CXXFLAGS="-O3 -Wall -Wextra -Wpedantic -Werror -std=c++17 -MMD -MP"

      - name: Run unit & integration tests
        run: make test
